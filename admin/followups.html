<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>War Room | ShepherdNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4facfe; --bg: #0f172a; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); --green: #00ff88; --red: #ff4b5c; --gold: #ffd700; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        .event-badge { background: linear-gradient(90deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.2)); border: 1px solid var(--primary); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; color: var(--primary); font-weight: bold; }

        /* KPI STATS */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .kpi-card { background: var(--glass); border: 1px solid var(--border); padding: 20px; border-radius: 15px; text-align: center; }
        .kpi-val { font-size: 2rem; font-weight: 700; display: block; line-height: 1; margin-bottom: 5px; }
        .kpi-lbl { font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; letter-spacing: 1px; }

        /* TABLE CONTROLS */
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input.search-bar { flex: 1; background: #1e293b; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; outline: none; min-width: 200px; }
        select.filter-box { background: #1e293b; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; outline: none; cursor: pointer; }

        /* DATA TABLE */
        .table-container { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; overflow-x: auto; backdrop-filter: blur(10px); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { text-align: left; padding: 15px; background: rgba(255,255,255,0.02); font-size: 0.75rem; text-transform: uppercase; opacity: 0.7; border-bottom: 1px solid var(--border); }
        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 0.85rem; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* STATUS BADGES */
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; }
        .st-present { background: rgba(0, 255, 136, 0.15); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.3); }
        .st-absent { background: rgba(255, 75, 92, 0.15); color: var(--red); border: 1px solid rgba(255, 75, 92, 0.3); }
        .st-expected { background: rgba(255, 215, 0, 0.15); color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.3); }
        
        .role-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>War Room</h1>
        <div id="eventDisplay" class="event-badge">Locating Next Event...</div>
        <a href="index.html" style="color:var(--primary); text-decoration:none; border:1px solid var(--border); padding:8px 16px; border-radius:8px; font-size:0.8rem;">Exit</a>
    </header>

    <div class="kpi-grid">
        <div class="kpi-card">
            <span class="kpi-val" id="valExpected" style="color:white">-</span>
            <span class="kpi-lbl">Total Expected</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-val" id="valPresent" style="color:var(--green)">-</span>
            <span class="kpi-lbl">Total Present</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-val" id="valAbsent" style="color:var(--red)">-</span>
            <span class="kpi-lbl">Absent / Pending</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-val" id="valPerf" style="color:var(--primary)">-</span>
            <span class="kpi-lbl">Performance</span>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search name, pastor, or hostel..." onkeyup="filterTable()">
        <select id="statusFilter" class="filter-box" onchange="filterTable()">
            <option value="all">Show All</option>
            <option value="present">Present</option>
            <option value="absent">Absent</option>
            <option value="expected">Expected (Pending)</option>
        </select>
        <select id="roleFilter" class="filter-box" onchange="filterTable()">
            <option value="all">All Roles</option>
            <option value="member">Members</option>
            <option value="invitee">Invitees</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="20%">Name / Role</th>
                    <th width="15%">Contact / Hostel</th>
                    <th width="20%">Shepherd / Leader</th>
                    <th width="15%">Pastor / Branch</th>
                    <th width="15%">Status</th>
                    <th width="15%">Last Update</th>
                </tr>
            </thead>
            <tbody id="masterTableBody">
                <tr><td colspan="6" style="text-align:center; padding:40px; opacity:0.5;">Loading Intelligence...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, limit, orderBy, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyCBv60eRCO0e4dFBMKGKnIATouxTuk1Bcc", authDomain: "fob-database-139d1.firebaseapp.com", projectId: "fob-database-139d1", storageBucket: "fob-database-139d1.firebasestorage.app", appId: "1:375165731354:web:b5fa57dcb2d71ee0d8c7a3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, "fobrealdbase");
    const auth = getAuth(app);

    let MASTER_LIST = []; 
    let PHONEBOOK = {}; 
    let TARGET_EVENT = null;

    onAuthStateChanged(auth, (user) => { if (user) init(); else location.href = "index.html"; });

    async function init() {
        try {
            // 1. Build Phonebook (ID -> Name) for display
            await buildPhonebook();

            // 2. Find Target Event
            const now = new Date();
            const q = query(collection(db, "events"), where("date", ">=", now), orderBy("date", "asc"), limit(10));
            const evSnap = await getDocs(q);
            
            if(!evSnap.empty) {
                // Find first non-dawn event
                const valid = evSnap.docs.find(d => !((d.data().title||d.data().name||"").toLowerCase().includes("dawn")));
                if (valid) {
                    const d = valid.data();
                    TARGET_EVENT = { id: valid.id, title: d.title || d.name, date: d.date.toDate() };
                }
            }

            // Fallback if no future event, get the last past event (Review Mode)
            if(!TARGET_EVENT) {
                const pastQ = query(collection(db, "events"), orderBy("date", "desc"), limit(1));
                const pastSnap = await getDocs(pastQ);
                if(!pastSnap.empty) {
                    const d = pastSnap.docs[0].data();
                    TARGET_EVENT = { id: pastSnap.docs[0].id, title: d.title || d.name, date: d.date.toDate() };
                }
            }

            if(TARGET_EVENT) {
                document.getElementById('eventDisplay').innerText = `🎯 ${TARGET_EVENT.title} (${TARGET_EVENT.date.toLocaleDateString()})`;
                loadMasterList();
            } else {
                document.getElementById('eventDisplay').innerText = "No Scheduled Events";
                document.getElementById('masterTableBody').innerHTML = "<tr><td colspan='6' style='text-align:center'>No events found in database.</td></tr>";
            }

        } catch(e) { console.error(e); }
    }

    async function buildPhonebook() {
        const collections = ["shepherds", "pastors", "master_admin"];
        for(const col of collections) {
            const snap = await getDocs(collection(db, col));
            snap.forEach(d => {
                const data = d.data();
                PHONEBOOK[d.id] = data.full_name || `${data.first_name||''} ${data.last_name||''}`.trim() || "Unknown";
            });
        }
    }

    async function loadMasterList() {
        MASTER_LIST = [];

        // A. FETCH MEMBERS (List 1)
        // Members are checked against the 'attendance' collection
        const memSnap = await getDocs(collection(db, "members"));
        const attSnap = await getDocs(collection(db, "attendance")); // Get all attendance (we filter in memory for speed on small datasets)
        
        memSnap.forEach(doc => {
            const m = doc.data();
            // Check attendance for this specific event
            // Logic: Does an attendance record exist where memberId == m.id AND eventId == TARGET_EVENT.id?
            const record = attSnap.docs.find(a => {
                const ad = a.data();
                return ad.memberId === doc.id && (ad.eventId === TARGET_EVENT.id || (ad.timestamp && ad.timestamp.toDate().toDateString() === TARGET_EVENT.date.toDateString()));
            });

            let status = 'expected';
            if (record) {
                const s = record.data().status.toLowerCase();
                if (s.includes('present')) status = 'present';
                else if (s.includes('absent')) status = 'absent';
            }

            MASTER_LIST.push({
                name: m.full_name,
                contact: m.phone || "-",
                hostel: m.hostel || m.residence || "-",
                role: 'member',
                shepherdId: m.shepherdId,
                pastorId: m.pastorId,
                status: status,
                note: record ? (record.data().notes || "") : ""
            });
        });

        // B. FETCH INVITEES (List 2)
        const invSnap = await getDocs(collection(db, "invitees"));
        invSnap.forEach(doc => {
            const i = doc.data();
            if(i.status === 'graduated') return; // Don't show graduated

            // Check history for this event
            let status = 'expected';
            let note = "";
            
            if (i.history && Array.isArray(i.history)) {
                const match = i.history.find(h => h.eventId === TARGET_EVENT.id);
                if (match) {
                    if (match.status === 'honoured') status = 'present';
                    else if (match.status === 'declined') status = 'absent';
                    note = match.reason || "";
                }
            }

            MASTER_LIST.push({
                name: i.fullName,
                contact: i.phone || "-",
                hostel: i.hostel || "-",
                role: 'invitee',
                shepherdId: i.shepherdId,
                pastorId: i.pastorId,
                status: status,
                note: note
            });
        });

        renderTable(MASTER_LIST);
        updateKPIs(MASTER_LIST);
    }

    function renderTable(data) {
        const tbody = document.getElementById('masterTableBody');
        if(data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:30px;'>No data found.</td></tr>";
            return;
        }

        tbody.innerHTML = data.map(row => {
            // Map IDs to Names
            const shepName = PHONEBOOK[row.shepherdId] || "Unassigned";
            const pastName = PHONEBOOK[row.pastorId] || "-";
            
            // Status Styling
            let pillClass = "st-expected";
            if (row.status === 'present') pillClass = "st-present";
            if (row.status === 'absent') pillClass = "st-absent";

            return `
            <tr>
                <td>
                    <b>${row.name}</b><br>
                    <span class="role-badge" style="color:${row.role==='member'?'var(--primary)':'var(--gold)'}">${row.role.toUpperCase()}</span>
                </td>
                <td>${row.contact}<br><span style="opacity:0.5; font-size:0.75rem;">${row.hostel}</span></td>
                <td>${shepName}</td>
                <td>${pastName}</td>
                <td><span class="status-pill ${pillClass}">${row.status}</span></td>
                <td style="font-size:0.75rem; opacity:0.6;">${row.note || "-"}</td>
            </tr>`;
        }).join('');
    }

    function updateKPIs(data) {
        const total = data.length;
        const present = data.filter(d => d.status === 'present').length;
        const absent = data.filter(d => d.status === 'absent').length;
        const expected = total - present - absent; // Those still pending

        document.getElementById('valExpected').innerText = total;
        document.getElementById('valPresent').innerText = present;
        document.getElementById('valAbsent').innerText = `${absent} / ${expected}`;
        
        const perf = total > 0 ? Math.round((present / total) * 100) : 0;
        document.getElementById('valPerf').innerText = perf + "%";
    }

    // --- FILTER LOGIC (Global Scope) ---
    window.filterTable = () => {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const statFilter = document.getElementById('statusFilter').value;
        const roleFilter = document.getElementById('roleFilter').value;

        const filtered = MASTER_LIST.filter(item => {
            // Search Text
            const textMatch = 
                item.name.toLowerCase().includes(search) || 
                (PHONEBOOK[item.shepherdId]||"").toLowerCase().includes(search) ||
                item.hostel.toLowerCase().includes(search);
            
            if (!textMatch) return false;

            // Status Filter
            if (statFilter !== 'all' && item.status !== statFilter) return false;

            // Role Filter
            if (roleFilter !== 'all' && item.role !== roleFilter) return false;

            return true;
        });

        renderTable(filtered);
    };
</script>
</body>
</html>

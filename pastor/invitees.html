<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invitee Mandate | ShepherdNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4facfe; --bg: #0f172a; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); --green: #00ff88; --red: #ff4b5c; --gold: #ffd700; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.5rem; }
        
        /* BANNER */
        .event-banner {
            background: linear-gradient(90deg, rgba(79, 172, 254, 0.1), rgba(0, 242, 254, 0.1)); 
            border: 1px solid var(--primary); color: white; padding: 15px; border-radius: 12px;
            text-align: center; margin-bottom: 25px; transition: 0.3s;
        }
        .event-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); display: block; }
        .event-time { font-size: 0.85rem; opacity: 0.8; font-family: monospace; }
        .locked-msg { color: var(--gold); font-size: 0.8rem; margin-top: 5px; font-weight: bold; }

        /* LOCKED STATE */
        .locked-banner {
            border: 1px solid var(--gold); background: rgba(255, 215, 0, 0.05);
            padding: 20px; text-align: center; border-radius: 12px; margin-bottom: 20px;
        }

        /* EVENT SECTION */
        .event-section { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 30px; overflow: hidden; }
        .event-header { background: linear-gradient(90deg, rgba(79, 172, 254, 0.15), rgba(0, 242, 254, 0.15)); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .ev-title { font-weight: 700; color: var(--primary); font-size: 1rem; }
        .ev-date { font-size: 0.8rem; opacity: 0.7; font-family: monospace; }
        .ev-badge { background: var(--gold); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; }
        .list-container { padding: 15px; }

        /* ADD FORM (Hidden by default) */
        .add-card { display: none; background: var(--glass); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 30px; }
        
        /* CHECKBOX GROUP */
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
        .checkbox-item input { width: auto; margin: 0; cursor: pointer; accent-color: var(--green); }
        
        input, select { width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border); box-sizing: border-box; font-family: inherit; font-size: 0.9rem; outline: none; margin-bottom: 10px; }
        input:focus { border-color: var(--primary); }

        /* INVITEE ITEM */
        .invitee-item { background: #1e293b; border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .invitee-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .invitee-info h3 { margin: 0; font-size: 1.1rem; }
        .invitee-info p { margin: 0; font-size: 0.8rem; opacity: 0.6; }
        
        .action-row { display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .btn-present { background: rgba(0, 255, 136, 0.15); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.3); }
        .btn-absent { background: rgba(255, 75, 92, 0.15); color: var(--red); border: 1px solid rgba(255, 75, 92, 0.3); }

        /* MODAL */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.95); z-index:1000; padding:20px; box-sizing:border-box; overflow-y: auto; }
        .modal-content { max-width:400px; margin:50px auto; background: #1e293b; border: 1px solid var(--border); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .counter-wrapper { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .counter-btn { width: 35px; height: 35px; border-radius: 8px; border: none; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        
        #lockMessage { text-align: center; padding: 40px; opacity: 0.6; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div>
            <h1>Invitee Mandate</h1>
            <p id="roleDisplay" style="opacity:0.6; font-size: 0.8rem; margin-top:5px; color:var(--primary); font-weight:600;">Connecting...</p>
        </div>
        <a id="dashLink" href="#" style="color:var(--primary); text-decoration:none; border:1px solid var(--primary); padding:6px 14px; border-radius:8px; font-size:0.8rem;">Dashboard</a>
    </div>

    <div id="lockMessage">
        <span style="font-size:2rem;">🔒</span><br>
        <h3 style="color:var(--gold); margin:10px 0;">Forms Locked</h3>
        <p>You can only target souls 48 hours before a service.</p>
    </div>

    <div id="addCard" class="add-card">
        <h3 style="margin:0 0 10px 0; color:var(--primary); font-size:1rem;">Target New Soul</h3>
        
        <label style="font-size:0.7rem; opacity:0.6; margin-bottom:5px; display:block;">SELECT EVENTS TO INVITE TO:</label>
        <div id="eventCheckboxes" class="checkbox-group"></div>

        <input type="text" id="invName" placeholder="Full Name">
        <div style="display:flex; gap:10px;">
            <input type="text" id="invHostel" placeholder="Residence/Hostel">
            <input type="tel" id="invPhone" placeholder="Phone Number">
        </div>
        <button onclick="addInvitee()" style="width:100%; padding:14px; background:var(--primary); border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:5px;">+ Add to Watchlist</button>
    </div>

    <div id="eventsArea">
        <p style="text-align:center; opacity:0.5; padding:20px;">Scanning schedule...</p>
    </div>
</div>

<div id="reportModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0;">Submit Report</h2>
        <p style="font-size:0.8rem; opacity:0.7;">Event: <span id="reportEventName" style="color:var(--primary); font-weight:bold;"></span></p>
        <p style="font-size:0.9rem; font-weight:bold; margin-bottom:20px;">Target: <span id="reportTargetName"></span></p>
        <input type="hidden" id="reportId">
        <input type="hidden" id="reportEventId">
        <input type="hidden" id="reportEventDate">
        <input type="hidden" id="reportStatus">

        <div id="reasonSection" style="display:none; margin-bottom:15px;">
            <label style="color:var(--red); font-size:0.7rem; font-weight:bold;">REASON FOR ABSENCE</label>
            <input type="text" id="reportReason" placeholder="Required..." style="border-color:var(--red);">
        </div>

        <label style="font-size:0.7rem; opacity:0.6;">EFFORT MADE</label>
        <div class="counter-wrapper">
            <span>📞 Calls</span>
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="counter-btn" style="background:var(--red); color:white;" onclick="adj('reportCalls', -1)">-</button>
                <span id="reportCalls" style="font-weight:bold; font-size:1.2rem;">0</span>
                <button class="counter-btn" style="background:var(--green); color:black;" onclick="adj('reportCalls', 1)">+</button>
            </div>
        </div>
        <div class="counter-wrapper">
            <span>🏠 Visits</span>
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="counter-btn" style="background:var(--red); color:white;" onclick="adj('reportVisits', -1)">-</button>
                <span id="reportVisits" style="font-weight:bold; font-size:1.2rem;">0</span>
                <button class="counter-btn" style="background:var(--green); color:black;" onclick="adj('reportVisits', 1)">+</button>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="document.getElementById('reportModal').style.display='none'" style="flex:1; padding:12px; background:transparent; border:1px solid var(--border); color:white; border-radius:10px;">Cancel</button>
            <button onclick="submitReport()" style="flex:2; padding:12px; background:var(--primary); border:none; color:black; font-weight:bold; border-radius:10px;">Submit</button>
        </div>
    </div>
</div>

<div id="promoModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary); margin-top:0;">Promote to Member</h2>
        <input type="hidden" id="promoId">
        <input type="text" id="promoFirstname" placeholder="First Name"><br>
        <input type="text" id="promoSurname" placeholder="Surname"><br>
        <button onclick="finalSubmitPromotion()" style="width:100%; padding:12px; background:var(--green); border:none; color:black; font-weight:bold; border-radius:10px; margin-top:10px;">Confirm</button>
        <button onclick="document.getElementById('promoModal').style.display='none'" style="width:100%; padding:12px; background:transparent; border:none; color:white; margin-top:5px;">Cancel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, serverTimestamp, getDoc, arrayUnion, deleteDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyCBv60eRCO0e4dFBMKGKnIATouxTuk1Bcc", authDomain: "fob-database-139d1.firebaseapp.com", projectId: "fob-database-139d1", storageBucket: "fob-database-139d1.firebasestorage.app", appId: "1:375165731354:web:b5fa57dcb2d71ee0d8c7a3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, "fobrealdbase");
    const auth = getAuth(app);
    
    let currentUser = null;
    let myRole = null; 
    let ACTIVE_EVENTS = []; 

    onAuthStateChanged(auth, async (user) => {
        if(user) { 
            currentUser = user; 
            await determineRole(user.uid);
            await fetchActiveEvents(); 
            loadInvitees(); 
        } else { location.href = "index.html"; }
    });

    async function determineRole(uid) {
        const link = document.getElementById('dashLink');
        const roleText = document.getElementById('roleDisplay');
        const aSnap = await getDoc(doc(db, "master_admin", uid));
        const pSnap = await getDoc(doc(db, "pastors", uid));
        const sSnap = await getDoc(doc(db, "shepherds", uid));
        
        if (aSnap.exists()) { myRole = 'master_admin'; link.href = "../admin/index.html"; roleText.innerText = "Personal Targets (Admin)"; } 
        else if (pSnap.exists()) { myRole = 'pastor'; link.href = "../pastor/index.html"; roleText.innerText = pSnap.data().chapel_name || "Pastor's Mandate"; } 
        else if (sSnap.exists()) { myRole = 'shepherd'; link.href = "../shepherd/index.html"; roleText.innerText = sSnap.data().chapel_name || "Shepherd's Watch"; } 
        else { link.href = "index.html"; roleText.innerText = "Guest User"; }
    }

    async function fetchActiveEvents() {
        const now = new Date();
        const future48h = new Date(now.getTime() + (48 * 60 * 60 * 1000)); 

        try {
            const q = query(collection(db, "events"), where("date", ">=", now), where("date", "<=", future48h), orderBy("date", "asc"));
            const snap = await getDocs(q);
            ACTIVE_EVENTS = [];

            snap.forEach(d => {
                const data = d.data();
                const title = (data.title || data.name || "").toLowerCase();
                if (!title.includes("dawn prayer")) {
                    ACTIVE_EVENTS.push({ id: d.id, title: data.title || data.name, date: data.date.toDate() });
                }
            });

            if (ACTIVE_EVENTS.length === 0) {
                const nextQ = query(collection(db, "events"), where("date", ">=", now), orderBy("date", "asc"), limit(1));
                const nextSnap = await getDocs(nextQ);
                if(!nextSnap.empty) {
                    const d = nextSnap.docs[0];
                    const data = d.data();
                    if (!data.name.toLowerCase().includes("dawn prayer")) {
                        ACTIVE_EVENTS.push({ id: d.id, title: data.title || data.name, date: data.date.toDate(), isLocked: true });
                    }
                }
            }
        } catch(e) { console.error(e); }
    }

    async function loadInvitees() {
        const mainArea = document.getElementById('eventsArea');
        const addCard = document.getElementById('addCard');
        const lockMsg = document.getElementById('lockMessage');
        const checkboxGroup = document.getElementById('eventCheckboxes');
        
        mainArea.innerHTML = "";
        checkboxGroup.innerHTML = ""; // Clear old checkboxes

        if(ACTIVE_EVENTS.length === 0) {
            mainArea.innerHTML = ""; addCard.style.display = 'none'; lockMsg.style.display = 'block'; return;
        }

        // --- FORM LOCKING & CHECKBOX GENERATION ---
        const openEvents = ACTIVE_EVENTS.filter(e => !e.isLocked);
        
        if (openEvents.length > 0) {
            addCard.style.display = 'block';
            lockMsg.style.display = 'none';
            
            // GENERATE CHECKBOXES
            openEvents.forEach(evt => {
                const dStr = evt.date.toLocaleDateString('en-GB', {weekday:'short'});
                checkboxGroup.innerHTML += `
                    <div class="checkbox-item">
                        <input type="checkbox" id="chk-${evt.id}" value="${evt.id}" checked>
                        <label for="chk-${evt.id}">${evt.title} (${dStr})</label>
                    </div>`;
            });
        } else {
            addCard.style.display = 'none';
            lockMsg.style.display = 'block';
        }

        // Fetch Invitees
        let q;
        if (myRole === 'master_admin' || myRole === 'pastor') q = query(collection(db, "invitees"), where("pastorId", "==", currentUser.uid));
        else q = query(collection(db, "invitees"), where("shepherdId", "==", currentUser.uid));
        
        const invSnap = await getDocs(q);
        const allInvitees = invSnap.docs.map(d => ({id:d.id, ...d.data()})).filter(d => d.status !== 'graduated');

        // Render Events
        ACTIVE_EVENTS.forEach(evt => {
            if (evt.isLocked) {
                const timeDiff = evt.date - new Date();
                const hours = Math.floor(timeDiff / 3600000);
                mainArea.innerHTML += `<div class="locked-banner"><h2 style="margin:0; color:var(--gold)">🔒 ${evt.title}</h2><p style="opacity:0.7;">Mandate Locked</p><span style="font-size:0.8rem; background:rgba(0,0,0,0.3); padding:4px 8px; border-radius:4px;">Opens in approx ${Math.max(0, hours-48)} hours</span></div>`;
                return;
            }

            const pendingInvitees = allInvitees.filter(inv => {
                if (!inv.history) return true;
                return !inv.history.some(h => h.eventId === evt.id);
            });

            if (pendingInvitees.length === 0) return;

            const dateStr = evt.date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
            
            let itemsHtml = pendingInvitees.map(inv => `
                <div class="invitee-item">
                    <div class="invitee-header">
                        <div class="invitee-info"><h3>${inv.fullName}</h3><p>📍 ${inv.hostel || 'No Addr'} | 📞 ${inv.phone}</p></div>
                        <button onclick="deleteInvitee('${inv.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-action btn-absent" onclick="openReport('${inv.id}', '${inv.fullName}', '${evt.id}', '${evt.title}', '${evt.date}', 'absent')">ABSENT</button>
                        <button class="btn-action btn-present" onclick="openReport('${inv.id}', '${inv.fullName}', '${evt.id}', '${evt.title}', '${evt.date}', 'present')">PRESENT</button>
                    </div>
                    <div style="text-align:center; margin-top:8px;"><button onclick="openPromo('${inv.id}')" style="background:none; border:none; color:var(--primary); font-size:0.7rem; cursor:pointer; text-decoration:underline;">Promote to Member 🎓</button></div>
                </div>`).join('');

            mainArea.innerHTML += `<div class="event-section"><div class="event-header"><div><span class="ev-title">${evt.title}</span><br><span class="ev-date">${dateStr}</span></div><span class="ev-badge">${pendingInvitees.length} Pending</span></div><div class="list-container">${itemsHtml}</div></div>`;
        });

        if (mainArea.innerHTML === "" && openEvents.length > 0) mainArea.innerHTML = "<p style='text-align:center; padding:40px; opacity:0.6;'>No active targets.<br><small>Add a soul to get started.</small></p>";
    }

    // --- ADD INVITEE WITH LOGIC ---
    window.addInvitee = async () => {
        const name = document.getElementById('invName').value;
        const phone = document.getElementById('invPhone').value;
        const hostel = document.getElementById('invHostel').value;
        if(!name) return alert("Required fields missing");
        
        let pastorId = currentUser.uid;
        if (myRole === 'shepherd') {
            const sSnap = await getDoc(doc(db, "shepherds", currentUser.uid));
            pastorId = sSnap.data().assigned_pastor_id || sSnap.data().pastorId;
        }

        // 1. CREATE INITIAL HISTORY (PRE-SKIP LOGIC)
        const initialHistory = [];
        
        // Loop through all currently OPEN checkboxes
        const checkboxes = document.querySelectorAll('#eventCheckboxes input[type="checkbox"]');
        
        checkboxes.forEach(chk => {
            if (!chk.checked) {
                // If UNCHECKED, we immediately mark this event as "Skipped" in history
                // Find the event details
                const evt = ACTIVE_EVENTS.find(e => e.id === chk.value);
                if (evt) {
                    initialHistory.push({
                        eventId: evt.id,
                        eventName: evt.title,
                        eventDate: evt.date,
                        status: 'skipped', // Hidden status
                        reason: "Not invited to this event",
                        reportTimestamp: new Date()
                    });
                }
            }
        });

        await addDoc(collection(db, "invitees"), { 
            fullName: name, phone, hostel, 
            shepherdId: currentUser.uid, 
            pastorId: pastorId, 
            calls: 0, visits: 0, status: 'unmarked', 
            lastUpdated: serverTimestamp(), 
            history: initialHistory // Apply skips immediately
        });
        
        location.reload();
    };

    window.openReport = (invId, invName, evtId, evtName, evtDate, status) => {
        document.getElementById('reportId').value = invId; document.getElementById('reportTargetName').innerText = invName;
        document.getElementById('reportEventId').value = evtId; document.getElementById('reportEventName').innerText = evtName;
        document.getElementById('reportEventDate').value = evtDate; document.getElementById('reportStatus').value = status;
        document.getElementById('reportCalls').innerText = "0"; document.getElementById('reportVisits').innerText = "0";
        document.getElementById('reportReason').value = ""; document.getElementById('reasonSection').style.display = status === 'absent' ? 'block' : 'none';
        document.getElementById('reportModal').style.display = 'block';
    };

    window.submitReport = async () => {
        const id = document.getElementById('reportId').value;
        const evtId = document.getElementById('reportEventId').value;
        const evtName = document.getElementById('reportEventName').innerText;
        const evtDate = new Date(document.getElementById('reportEventDate').value);
        const status = document.getElementById('reportStatus').value;
        const calls = parseInt(document.getElementById('reportCalls').innerText);
        const visits = parseInt(document.getElementById('reportVisits').innerText);
        const reason = document.getElementById('reportReason').value;
        if (status === 'absent' && !reason) return alert("Reason required.");

        try {
            const entry = { eventId: evtId, eventName: evtName, eventDate: evtDate, status: status === 'present' ? 'honoured' : 'declined', calls: calls, visits: visits, reason: reason || "N/A", reportTimestamp: new Date() };
            await updateDoc(doc(db, "invitees", id), { history: arrayUnion(entry), lastUpdated: serverTimestamp(), calls: calls, visits: visits, status: status === 'present' ? 'honoured' : 'declined' });
            document.getElementById('reportModal').style.display = 'none'; loadInvitees();
        } catch(e) { alert("Error: " + e.message); }
    };

    window.adj = (id, val) => { const el = document.getElementById(id); let c = parseInt(el.innerText)+val; if(c<0)c=0; el.innerText=c; };
    window.deleteInvitee = async (id) => { if(confirm("Delete?")) { await deleteDoc(doc(db, "invitees", id)); loadInvitees(); } };
    window.openPromo = async (id) => { document.getElementById('promoId').value = id; document.getElementById('promoModal').style.display = 'block'; };
    window.finalSubmitPromotion = async () => { const id = document.getElementById('promoId').value; try { const invSnap = await getDoc(doc(db, "invitees", id)); const d = invSnap.data(); await addDoc(collection(db, "members"), { first_name: document.getElementById('promoFirstname').value, last_name: document.getElementById('promoSurname').value, full_name: `${document.getElementById('promoFirstname').value} ${document.getElementById('promoSurname').value}`, phone: d.phone, status: "New Convert", pastorId: d.pastorId, shepherdId: d.shepherdId, timestamp: serverTimestamp() }); await updateDoc(doc(db, "invitees", id), { status: 'graduated' }); alert("Promoted!"); location.reload(); } catch(e) { alert(e.message); } };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Chapel Performance | ShepherdNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4facfe; --bg: #0f172a; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); --green: #00ff88; --red: #ff4b5c; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 1.5rem; }
        
        /* METRICS GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--glass); border: 1px solid var(--border); padding: 20px; border-radius: 20px; backdrop-filter: blur(10px); }
        
        .stat-label { font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 2rem; font-weight: 600; color: var(--primary); display: block; margin-top: 5px; }
        
        /* TABLE STYLING */
        .table-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 25px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; font-size: 0.75rem; opacity: 0.5; padding: 15px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        
        .rank-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .high { background: rgba(0, 255, 136, 0.1); color: var(--green); }
        .mid { background: rgba(255, 215, 0, 0.1); color: #ffd700; }
        .low { background: rgba(255, 75, 92, 0.1); color: var(--red); }

        .btn-action { background: var(--primary); border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; text-decoration: none; font-size: 0.8rem; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 id="chapelTitle">My Chapel</h1>
            <p id="pastorWelcome" style="opacity:0.6; font-size:0.9rem;">Loading Intelligence...</p>
        </div>
        <div style="display:flex; gap:10px;">
            <a href="invitees.html" class="btn-action" style="background: var(--glass); border:1px solid var(--border);">Invitees</a>
            <a href="index.html" class="btn-action">Dashboard</a>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <span class="stat-label">Total Flock</span>
            <span id="totalMembers" class="stat-value">-</span>
        </div>
        <div class="card">
            <span class="stat-label">Chapel Attendance</span>
            <span id="avgAttendance" class="stat-value">-</span>
        </div>
        <div class="card">
            <span class="stat-label">Conversion Health</span>
            <span id="convHealth" class="stat-value">-</span>
        </div>
    </div>

    <div class="table-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0">Shepherd Performance Registry</h3>
            <button onclick="window.location.href='add-shepherd.html'" style="background:rgba(255,255,255,0.1); border:none; padding:8px 15px; border-radius:6px; color:white; cursor:pointer; font-size:0.75rem;">+ Add Shepherd</button>
        </div>
        
        <table id="shepherdTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Shepherd Name</th>
                    <th>Assigned Souls</th>
                    <th>Attendance %</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="shepherdBody">
                <tr><td colspan="5" style="text-align:center; padding:30px; opacity:0.5;">Analyzing Data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCBv60eRCO0e4dFBMKGKnIATouxTuk1Bcc", authDomain: "fob-database-139d1.firebaseapp.com", projectId: "fob-database-139d1", storageBucket: "fob-database-139d1.firebasestorage.app", appId: "1:375165731354:web:b5fa57dcb2d71ee0d8c7a3" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, "fobrealdbase");

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        loadChapelStats(user.uid);
    });

    async function loadChapelStats(pastorId) {
        try {
            // 1. FETCH PASTOR PROFILE
            const pDoc = await getDoc(doc(db, "pastors", pastorId));
            const pData = pDoc.exists() ? pDoc.data() : { full_name: "Pastor", chapel_name: "My Chapel" };
            
            document.getElementById('chapelTitle').innerText = pData.chapel_name || "My Chapel";
            document.getElementById('pastorWelcome').innerText = `Overseer: ${pData.full_name}`;

            // 2. FETCH EVENTS (Global but Filtered for History)
            const eSnap = await getDocs(collection(db, "events"));
            const now = new Date();
            const validDates = []; // YYYY-MM-DD strings
            
            eSnap.forEach(d => {
                const data = d.data();
                const title = (data.title || data.name || "").toLowerCase();
                if (title.includes("dawn prayer")) return; // Filter Dawn Prayers

                const dDate = data.date && data.date.toDate ? data.date.toDate() : new Date(data.date);
                if (dDate <= now) {
                    validDates.push(data.dateString || dDate.toISOString().split('T')[0]);
                }
            });
            validDates.sort();

            // 3. FETCH DATA (Scoped to THIS Pastor)
            // Note: We fetch ALL attendance for members under this pastor
            const [sSnap, mSnap, aSnap] = await Promise.all([
                getDocs(query(collection(db, "shepherds"), where("assigned_pastor_id", "==", pastorId))),
                getDocs(query(collection(db, "members"), where("pastorId", "==", pastorId))),
                getDocs(query(collection(db, "attendance"), where("pastorId", "==", pastorId))) 
            ]);

            // 4. MAP ATTENDANCE (Fast Lookup)
            const attendanceLog = {}; 
            aSnap.forEach(d => {
                const att = d.data();
                if (att.status && att.status.toLowerCase().includes('present')) {
                    // Try to resolve date string
                    let dStr = att.dateString;
                    if (!dStr && att.timestamp) dStr = att.timestamp.toDate().toISOString().split('T')[0];
                    if (dStr) attendanceLog[`${att.memberId}_${dStr}`] = true;
                }
            });

            // 5. CALCULATE STATS PER SHEPHERD
            const shepherdStats = [];
            const members = [];
            
            // Map Shepherds
            const shepMap = {};
            sSnap.forEach(doc => {
                const s = doc.data();
                shepMap[doc.id] = { 
                    id: doc.id, 
                    name: s.full_name || "Unknown", 
                    members: [], 
                    score: 0 
                };
            });

            // Distribute Members to Shepherds
            mSnap.forEach(doc => {
                const m = doc.data();
                members.push(m); // For total count
                const sId = m.shepherdId;
                
                // If member has a shepherd in this chapel, add to their list
                if (sId && shepMap[sId]) {
                    shepMap[sId].members.push({ id: doc.id, joined: m.registration_date });
                }
            });

            // Calculate Scores
            let totalAttSum = 0;
            let totalScoredMembers = 0;

            Object.values(shepMap).forEach(shep => {
                if (shep.members.length === 0) {
                    shepherdStats.push({ ...shep, rate: 0 });
                    return;
                }

                let sumRates = 0;
                let scoredCount = 0;

                shep.members.forEach(mem => {
                    const joinDate = mem.joined ? new Date(mem.joined) : new Date('2024-01-01');
                    const joinStr = joinDate.toISOString().split('T')[0];
                    
                    // Filter services valid for this member
                    const eligibleDates = validDates.filter(d => d >= joinStr);
                    
                    if (eligibleDates.length > 0) {
                        let present = 0;
                        eligibleDates.forEach(d => {
                            if (attendanceLog[`${mem.id}_${d}`]) present++;
                        });
                        const rate = (present / eligibleDates.length) * 100;
                        sumRates += rate;
                        scoredCount++;
                    }
                });

                const finalRate = scoredCount > 0 ? Math.round(sumRates / scoredCount) : 0;
                
                // Add to Chapel Totals
                totalAttSum += sumRates;
                totalScoredMembers += scoredCount;

                shepherdStats.push({ ...shep, rate: finalRate });
            });

            // 6. RENDER UI
            shepherdStats.sort((a,b) => b.rate - a.rate);

            // Chapel Totals
            const chapelAvg = totalScoredMembers > 0 ? Math.round(totalAttSum / totalScoredMembers) : 0;
            const estMembers = members.filter(m => m.status === 'Established Member').length;
            const convRate = members.length > 0 ? Math.round((estMembers / members.length) * 100) : 0;

            document.getElementById('totalMembers').innerText = members.length;
            document.getElementById('avgAttendance').innerText = `${chapelAvg}%`;
            document.getElementById('avgAttendance').style.color = chapelAvg > 70 ? 'var(--green)' : 'var(--red)';
            document.getElementById('convHealth').innerText = `${convRate}%`;

            // Table
            const tbody = document.getElementById('shepherdBody');
            if (shepherdStats.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No Shepherds Assigned.</td></tr>`;
            } else {
                tbody.innerHTML = shepherdStats.map((s, i) => {
                    let badge = 'low';
                    let label = 'Needs Help';
                    if (s.rate > 70) { badge = 'high'; label = 'Excellent'; }
                    else if (s.rate > 40) { badge = 'mid'; label = 'Average'; }

                    return `
                    <tr>
                        <td style="opacity:0.5">#${i+1}</td>
                        <td style="font-weight:600; color:white;">${s.name}</td>
                        <td>${s.members.length}</td>
                        <td style="font-family:monospace; font-size:1rem;">${s.rate}%</td>
                        <td><span class="rank-badge ${badge}">${label}</span></td>
                    </tr>`;
                }).join('');
            }

        } catch (e) {
            console.error(e);
            document.getElementById('pastorWelcome').innerText = "Error loading data.";
        }
    }
</script>
</body>
</html>
